<!doctype html>
<html lang="en" class="dark">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/site.webmanifest" />
	<meta name="theme-color" content="#09090b" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<!-- Replaced per request by the server (server/og/meta.ts) so shared links unfurl with their own
	     title, description and image. Keep the markers. -->
	<!--og:start-->
	<title>MeltCalc</title>
	<meta property="og:title" content="MeltCalc" />
	<meta name="twitter:title" content="MeltCalc" />

	<meta name="description" content="Hotend and polymer melt index tool">
	<meta property="og:description" content="Hotend and polymer melt index tool" />
	<meta name="twitter:description" content="Hotend and polymer melt index tool" />

	<meta property="og:url" content="%VITE_BASE_URL%" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="MeltCalc" />
	<meta property="og:locale" content="en_US" />

	<meta property="og:image" content="%VITE_BASE_URL%/og.png" />
	<meta property="og:image:type" content="image/png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="MeltCalc" />

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:image" content="%VITE_BASE_URL%/og.png" />
	<!--og:end-->
</head>

<body>
	<!-- Replaced per request by the server (server/seo.ts). React clears `#root` on mount, so a
	     visitor never sees this — it is here for the crawlers that do not run JavaScript, and it
	     says the same thing the app does. Keep the markers. -->
	<div id="root">
		<!--seo:start-->
		<!--seo:end-->
	</div>
	<noscript>
		MeltCalc compares 3D printer hotends by melt zone length, sustainable volumetric flow rate,
		residence time, heater power and cost per mm³/s. It needs JavaScript to draw its charts.
	</noscript>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
